services:
  ciallo-proxy-multi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: ciallo-ms365-proxy-multi:local
    container_name: ciallo-ms365-proxy-multi
    ports:
      # Bind all interfaces so LAN hosts can reach the proxy.
      - "8810:8000"
    env_file:
      - .env
    volumes:
      - chrome-profile:/chrome-profile
      - token-data:/home/app/token
    restart: unless-stopped
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

volumes:
  chrome-profile:
  token-data:
